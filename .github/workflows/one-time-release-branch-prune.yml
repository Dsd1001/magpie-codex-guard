name: One-time cleanup of merged Codex Guard release branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-release-branch-prune.yml']
permissions:
  contents: write
jobs:
  prune:
    if: "github.repository == 'Dsd1001/magpie-codex-guard' && github.event.head_commit.message == 'chore: one-time prune old release branches'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_REFS: |
        release/fingerprint-bank-alpha10 51ffe7b93ad90dab23c5b0a4456641a86de050b8
        release/model-catalog-alpha6 1d6fa0397595c8128d86462560b4b920f1610ed9
        release/native-route-alpha8 4f086ee21061c0670f881640061912bcfd899828
        release/roster-swap-alpha14 5a12cd9933b7cae4da9bc72958d0461059d319ae
        release/safe-routing-alpha12 53918e1af583e1fc800fbf0ac297683572ef74b8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all exact release branch tips are merged to main
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected; do
            [ -n "$branch" ] || continue
            case "$branch" in release/*) ;; *) echo 'Unexpected ref'; exit 1 ;; esac
            actual=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then echo "Branch moved: $branch. Refusing deletion."; exit 1; fi
            git merge-base --is-ancestor "$expected" HEAD || { echo "Not merged: $branch"; exit 1; }
            echo "Verified: $branch"
          done <<< "$EXPECTED_REFS"
      - name: Delete only verified merged release refs using SHA leases
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected; do
            [ -n "$branch" ] || continue
            git push --force-with-lease="refs/heads/$branch:$expected" origin ":refs/heads/$branch"
            echo "Deleted: $branch"
          done <<< "$EXPECTED_REFS"
