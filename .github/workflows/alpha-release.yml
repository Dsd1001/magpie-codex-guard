name: Build Codex Guard Alpha Release
# CI waits for re-rendered question checkboxes before asserting saved selections.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-release.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'scripts/build-release.sh'
      - 'scripts/sync-fingerprint-bank.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alpha:
    if: github.repository == 'Dsd1001/magpie-codex-guard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # GitHub's app-based repository API cannot ingest the binary directly
      # from a local workspace. Pin and verify it in this trusted release job,
      # then vendor the immutable artifact back into main before building.
      - name: Sync and commit pinned upstream fingerprint artifact
        run: |
          set -eu
          python3 scripts/sync-fingerprint-bank.py --write
          python3 scripts/sync-fingerprint-bank.py --check
          if ! git diff --quiet -- internal/fingerprint/data/shared_detector.bin internal/fingerprint/data/model_metadata.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/fingerprint/data/shared_detector.bin internal/fingerprint/data/model_metadata.json
            git commit -m 'chore(fingerprint): vendor verified lm-detector reference artifact [skip ci]'
            git push origin 'HEAD:refs/heads/main'
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Unit and static tests
        run: |
          python3 scripts/sync-fingerprint-bank.py --check
          go test ./...
          go vet ./...
          npm ci
          npm run check:js
          npm run test:ui
      - name: Build Linux and macOS binaries and package
        run: npm run build:release
      - name: Publish immutable prerelease artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          ARCHIVE="dist/magpie-codex-guard-${VERSION}.tgz"
          test -s "$ARCHIVE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing immutable alpha release $TAG"
            exit 1
          fi
          sha256sum "$ARCHIVE" bin/codex-guard-* > dist/SHA256SUMS
          gh release create "$TAG" "$ARCHIVE" dist/SHA256SUMS --target "$(git rev-parse HEAD)" --title "$TAG" --prerelease --notes "Codex Guard alpha.26: update embedded lm-detector fingerprint bank to 64 models (2026-10-27) and sync upstream sequence-shape scoring; new golden parity fixtures, immutable upstream SHA-256 checks and preserved isolation/timing state."
